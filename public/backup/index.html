<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Portfolio & Gallery</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .filter-bar {
      background: #ffffff;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #e5e5e5;
      margin-bottom: 20px;
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      align-items: center;
    }
    .form-control {
      padding: 8px 10px;
      font-size: 9pt;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: inherit;
      background: #fff;
    }
    .bio-section {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      padding: 25px;
      margin-bottom: 25px;
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }
    .artwork-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }
    .artwork-card {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
      transition: transform 0.2s ease;
    }
    .artwork-card:hover {
      box-shadow: 0 5px 15px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .phase-tag {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--accent-color, #c5a059);
      color: #ffffff;
      font-size: 7.5pt;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 3px;
    }
    .artwork-thumb {
      width: 100%;
      height: 190px;
      object-fit: contain;
      background: #fafafa;
      border-bottom: 1px solid #eee;
      cursor: pointer;
    }
    .artwork-info { padding: 12px; display: flex; flex-direction: column; gap: 4px; }
    .artwork-card-title { font-family: 'Cinzel', serif; font-weight: bold; font-size: 10pt; }
    .artwork-card-meta { font-size: 8pt; color: #666; }
    .artwork-card-price { font-size: 9.5pt; font-weight: bold; color: var(--accent-color, #c5a059); margin-top: 4px; }
    
    .inquire-btn {
      margin-top: 8px;
      background: var(--primary-color, #1a1a1a);
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 3px;
      font-size: 7.5pt;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .inquire-btn:hover { background: var(--accent-color, #c5a059); }

    /* Lightbox Modal */
    .lightbox-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .lightbox-container {
      background: #fff;
      border-radius: 6px;
      max-width: 800px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .lightbox-img-wrap {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox-img {
      max-width: 100%;
      max-height: 70vh;
      object-fit: contain;
    }
    .lightbox-details {
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Inquiry Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6);
      z-index: 2500;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 6px;
      width: 100%;
      max-width: 450px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    /* Toast Notification */
    #toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      padding: 12px;
      position: fixed;
      z-index: 3000;
      right: 20px;
      bottom: 20px;
      font-size: 9pt;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    #toast.show { visibility: visible; animation: fadein 0.3s, fadeout 0.5s 2.5s; }
    @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 20px; opacity: 1; } }
    @keyframes fadeout { from { bottom: 20px; opacity: 1; } to { bottom: 0; opacity: 0; } }

    @media (max-width: 768px) {
      .bio-section { grid-template-columns: 1fr; }
      .lightbox-container { grid-template-columns: 1fr; max-width: 500px; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo" id="header-artist-name">Artist Portfolio</div>
    <nav class="nav-links">
      <a href="index.html" style="color:#fff; text-decoration:none; font-size:9pt; font-weight:500;">Gallery</a>
      <a href="admin.html" style="color:#fff; text-decoration:none; font-size:9pt; font-weight:500;">Admin Dashboard</a>
    </nav>
  </header>

  <main class="container" style="max-width: 1200px; margin: 30px auto; padding: 0 20px;">
    
    <!-- Artist Bio & Contact Banner -->
    <div class="bio-section">
      <div>
        <h2 id="bio-title" style="font-family: 'Cinzel', serif; font-size: 14pt; margin-bottom: 10px;">About the Artist</h2>
        <p id="artist-statement" style="font-size: 9pt; color: #444; line-height: 1.6; margin-bottom: 10px;">Loading artist statement...</p>
        <p id="artist-bio" style="font-size: 8.5pt; color: #666; line-height: 1.5;"></p>
      </div>
      <div style="border-left: 1px solid #eee; padding-left: 20px; display: flex; flex-direction: column; justify-content: center; gap: 8px;">
        <h4 style="font-family: 'Cinzel', serif; font-size: 10pt; margin-bottom: 5px;">Inquiries & Contact</h4>
        <div style="font-size: 8.5pt; color: #555;"><strong>Email:</strong> <span id="contact-email">Loading...</span></div>
        <div style="font-size: 8.5pt; color: #555;"><strong>Phone:</strong> <span id="contact-phone">Loading...</span></div>
        <div style="font-size: 8.5pt; color: #555;"><strong>Location:</strong> <span id="contact-location">Cairo, Egypt</span></div>
      </div>
    </div>

    <!-- Filter & Currency Bar -->
    <div class="filter-bar">
      <div style="flex: 1; min-width: 140px;">
        <label style="display:block; font-size:8pt; font-weight:600; margin-bottom:3px; color:#555;">Collection / Phase</label>
        <select id="filter-phase" class="form-control" style="width:100%;" onchange="loadArtworks()">
          <option value="ALL">All Collections</option>
        </select>
      </div>
      <div style="flex: 1; min-width: 140px;">
        <label style="display:block; font-size:8pt; font-weight:600; margin-bottom:3px; color:#555;">Medium</label>
        <select id="filter-medium" class="form-control" style="width:100%;" onchange="loadArtworks()">
          <option value="ALL">All Mediums</option>
        </select>
      </div>
      <div style="flex: 1; min-width: 130px;">
        <label style="display:block; font-size:8pt; font-weight:600; margin-bottom:3px; color:#555;">Status</label>
        <select id="filter-status" class="form-control" style="width:100%;" onchange="loadArtworks()">
          <option value="ALL">All Statuses</option>
        </select>
      </div>
      <div style="flex: 1; min-width: 110px;">
        <label style="display:block; font-size:8pt; font-weight:600; margin-bottom:3px; color:#555;">Year</label>
        <select id="filter-year" class="form-control" style="width:100%;" onchange="loadArtworks()">
          <option value="ALL">All Years</option>
        </select>
      </div>
      <div style="flex: 1; min-width: 130px;">
        <label style="display:block; font-size:8pt; font-weight:600; margin-bottom:3px; color:#555;">Currency</label>
        <select id="currency-selector" class="form-control" style="width:100%; font-weight:600; background:#f9f9f9;" onchange="changeCurrency()">
          <option value="EGP">EGP (EGP)</option>
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
        </select>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 8.5pt; color: #666;">
      <span id="artwork-count-badge">Loading artworks...</span>
    </div>

    <div id="artwork-grid" class="artwork-grid"></div>

  </main>

  <!-- Lightbox Modal Overlay -->
  <div class="lightbox-overlay" id="lightbox-modal" onclick="closeLightbox(event)">
    <div class="lightbox-container" onclick="event.stopPropagation()">
      <div class="lightbox-img-wrap">
        <img id="lightbox-img" src="" class="lightbox-img" alt="Artwork Lightbox View" />
      </div>
      <div class="lightbox-details">
        <div>
          <div id="lightbox-phase" style="font-size: 7.5pt; font-weight: bold; color: var(--accent-color, #c5a059); text-transform: uppercase; margin-bottom: 4px;"></div>
          <h3 id="lightbox-title" style="font-family: 'Cinzel', serif; font-size: 13pt; margin-bottom: 10px;"></h3>
          <div style="font-size: 9pt; color: #555; display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px;">
            <div><strong>Medium:</strong> <span id="lightbox-medium"></span></div>
            <div><strong>Year:</strong> <span id="lightbox-year"></span></div>
            <div><strong>Dimensions:</strong> <span id="lightbox-dims"></span></div>
            <div><strong>Status:</strong> <span id="lightbox-status"></span></div>
            <div style="font-size: 11pt; font-weight: bold; color: var(--accent-color, #c5a059); margin-top: 5px;">Price: <span id="lightbox-price"></span></div>
          </div>
        </div>
        <div style="display: flex; gap: 10px;">
          <button onclick="openInquiryFromLightbox()" class="inquire-btn" style="flex: 1; padding: 10px; font-size: 8.5pt;">Inquire About This Piece</button>
          <button onclick="document.getElementById('lightbox-modal').style.display='none'" style="background: #e0e0e0; color: #333; border: none; padding: 10px 15px; border-radius: 4px; font-weight: 600; cursor: pointer; font-size: 8.5pt;">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Buyer Inquiry Modal -->
  <div class="modal-overlay" id="inquiry-modal">
    <div class="modal-card">
      <div style="font-family: 'Cinzel', serif; font-size: 11pt; font-weight: bold; margin-bottom: 4px;">Inquire About Artwork</div>
      <div id="inquiry-artwork-subtitle" style="font-size: 8.5pt; color: #666; margin-bottom: 15px;"></div>
      <form onsubmit="submitInquiry(event)" style="display: flex; flex-direction: column; gap: 10px;">
        <input type="hidden" id="inquiry-art-id">
        <div>
          <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Your Full Name</label>
          <input type="text" id="inquiry-name" class="form-control" required style="width: 100%;">
        </div>
        <div>
          <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Email Address / Phone</label>
          <input type="text" id="inquiry-contact" class="form-control" required style="width: 100%;">
        </div>
        <div>
          <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Message / Offer Details</label>
          <textarea id="inquiry-message" rows="3" class="form-control" placeholder="I am interested in acquiring this piece..." required style="width: 100%; font-family: inherit;"></textarea>
        </div>
        <div style="display: flex; gap: 10px; margin-top: 5px;">
          <button type="submit" style="background: var(--accent-color, #c5a059); color: #fff; border: none; padding: 10px 15px; border-radius: 4px; font-weight: 600; cursor: pointer; flex: 1;">Send Inquiry</button>
          <button type="button" onclick="closeInquiryModal()" style="background: #e0e0e0; color: #333; border: none; padding: 10px 15px; border-radius: 4px; font-weight: 600; cursor: pointer;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    
    const SUPABASE_URL = 'https://vuifcweuslilgxsggsei.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_jm_dvdw_BGDNfkzKPniO6A_Em0EgOun';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let allArtworksCache = [];
    let currentFilteredCache = [];
    let currentLightboxArt = null;
    let artistContactEmail = "";

    // Approximate conversion rates relative to EGP
    const exchangeRates = {
      EGP: { rate: 1, symbol: 'EGP' },
      USD: { rate: 0.020, symbol: '$' },  // Approximate baseline rate
      EUR: { rate: 0.019, symbol: '€' }   // Approximate baseline rate
    };

    window.addEventListener('DOMContentLoaded', async () => {
      await fetchBranding();
      await fetchAllArtworks();
    });

    async function fetchBranding() {
      try {
        const { data } = await supabaseClient.from('branding_config').select('*');
        if (data && data.length > 0) {
          const config = {};
          data.forEach(item => config[item.key] = item.value);

          if (config.Artist_Name) {
            document.getElementById('header-artist-name').innerText = config.Artist_Name;
            document.getElementById('bio-title').innerText = `About ${config.Artist_Name}`;
          }
          if (config.Artist_Statement) {
            document.getElementById('artist-statement').innerText = config.Artist_Statement;
          }
          if (config.Artist_Bio) {
            document.getElementById('artist-bio').innerText = config.Artist_Bio;
          }
          if (config.Contact_Email) {
            artistContactEmail = config.Contact_Email;
            document.getElementById('contact-email').innerText = config.Contact_Email;
          }
          if (config.Contact_Phone) {
            document.getElementById('contact-phone').innerText = config.Contact_Phone;
          }
        }
      } catch (err) {
        console.error("Error loading branding config:", err);
      }
    }

    async function fetchAllArtworks() {
      const countBadge = document.getElementById('artwork-count-badge');
      try {
        const { data, error } = await supabaseClient.from('artworks').select('*').order('artwork_id', { ascending: true });
        
        if (error) {
          countBadge.innerText = "Error loading database records: " + error.message;
          return;
        }

        allArtworksCache = data || [];
        populateDropdowns(allArtworksCache);
        loadArtworks();
      } catch (err) {
        countBadge.innerText = "Failed to connect to database.";
      }
    }

    function populateDropdowns(artworks) {
      const phases = new Set();
      const mediums = new Set();
      const statuses = new Set();
      const years = new Set();

      artworks.forEach(art => {
        if (art.phase_collection) phases.add(String(art.phase_collection).trim());
        if (art.medium) mediums.add(String(art.medium).trim());
        if (art.status) statuses.add(String(art.status).trim());
        if (art.year) years.add(String(art.year).trim());
      });

      fillSelect('filter-phase', Array.from(phases).sort(), 'All Collections');
      fillSelect('filter-medium', Array.from(mediums).sort(), 'All Mediums');
      fillSelect('filter-status', Array.from(statuses).sort(), 'All Statuses');
      fillSelect('filter-year', Array.from(years).sort((a,b) => b - a), 'All Years');
    }

    function fillSelect(elemId, list, defaultLabel) {
      const sel = document.getElementById(elemId);
      const currentVal = sel.value;
      sel.innerHTML = `<option value="ALL">${defaultLabel}</option>`;
      list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.innerText = item;
        sel.appendChild(opt);
      });
      sel.value = currentVal || 'ALL';
    }

    function loadArtworks() {
      const fPhase = document.getElementById('filter-phase').value;
      const fMedium = document.getElementById('filter-medium').value;
      const fStatus = document.getElementById('filter-status').value;
      const fYear = document.getElementById('filter-year').value;

      currentFilteredCache = allArtworksCache.filter(art => {
        if (fPhase !== 'ALL' && String(art.phase_collection || '').trim() !== fPhase) return false;
        if (fMedium !== 'ALL' && String(art.medium || '').trim() !== fMedium) return false;
        if (fStatus !== 'ALL' && String(art.status || '').trim() !== fStatus) return false;
        if (fYear !== 'ALL' && String(art.year || '').trim() !== fYear) return false;
        return true;
      });

      renderGrid(currentFilteredCache);
    }

    function changeCurrency() {
      renderGrid(currentFilteredCache);
    }

    function formatPrice(priceVal, statusVal) {
      if (!priceVal || priceVal <= 0) return statusVal || 'POA';
      const curKey = document.getElementById('currency-selector').value || 'EGP';
      const config = exchangeRates[curKey] || exchangeRates['EGP'];
      const converted = parseFloat(priceVal) * config.rate;

      if (curKey === 'EGP') {
        return `${converted.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 })} EGP`;
      } else {
        return `${config.symbol}${converted.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 })} ${curKey}`;
      }
    }

    function renderGrid(artworks) {
      const grid = document.getElementById('artwork-grid');
      const countBadge = document.getElementById('artwork-count-badge');
      grid.innerHTML = '';
      countBadge.innerText = `Showing ${artworks.length} artwork(s)`;

      if (!artworks || artworks.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #888;">No artworks found matching criteria.</div>`;
        return;
      }

      artworks.forEach(art => {
        const card = document.createElement('div');
        card.className = 'artwork-card';

        const displayPrice = formatPrice(art.price, art.status);
        const imgUrl = art.image_url || 'https://via.placeholder.com/300x200?text=No+Image';

        card.innerHTML = `
          <div class="phase-tag">${art.phase_collection || 'Unassigned'}</div>
          <img src="${imgUrl}" class="artwork-thumb" alt="${art.title}" onclick='openLightbox(${JSON.stringify(art)})' />
          <div class="artwork-info">
            <div class="artwork-card-title">${art.title || 'Untitled'}</div>
            <div class="artwork-card-meta">${art.medium || 'Unspecified'}</div>
            <div class="artwork-card-meta">${art.height_cm || 0} × ${art.width_cm || 0} cm</div>
            <div class="artwork-card-price">${displayPrice}</div>
            <button onclick='openInquiryModal(${JSON.stringify(art)})' class="inquire-btn">Inquire About Piece</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openLightbox(art) {
      currentLightboxArt = art;
      document.getElementById('lightbox-img').src = art.image_url || '';
      document.getElementById('lightbox-phase').innerText = art.phase_collection || 'Unassigned';
      document.getElementById('lightbox-title').innerText = art.title || 'Untitled';
      document.getElementById('lightbox-medium').innerText = art.medium || 'Unspecified';
      document.getElementById('lightbox-year').innerText = art.year || 'N/A';
      document.getElementById('lightbox-dims').innerText = `${art.height_cm || 0} × ${art.width_cm || 0} cm (${art.height_inches || 0} × ${art.width_inches || 0} in)`;
      document.getElementById('lightbox-status').innerText = art.status || 'Available';
      document.getElementById('lightbox-price').innerText = formatPrice(art.price, art.status);
      
      document.getElementById('lightbox-modal').style.display = 'flex';
    }

    function closeLightbox(e) {
      if (e.target.id === 'lightbox-modal') {
        document.getElementById('lightbox-modal').style.display = 'none';
      }
    }

    function openInquiryFromLightbox() {
      document.getElementById('lightbox-modal').style.display = 'none';
      if (currentLightboxArt) {
        openInquiryModal(currentLightboxArt);
      }
    }

    function openInquiryModal(art) {
      document.getElementById('inquiry-art-id').value = art.artwork_id;
      document.getElementById('inquiry-artwork-subtitle').innerText = `Piece: ${art.title} (${art.artwork_id})`;
      document.getElementById('inquiry-modal').style.display = 'flex';
    }

    function closeInquiryModal() {
      document.getElementById('inquiry-modal').style.display = 'none';
    }

    function submitInquiry(e) {
      e.preventDefault();
      const artId = document.getElementById('inquiry-art-id').value;
      const name = document.getElementById('inquiry-name').value;
      const contact = document.getElementById('inquiry-contact').value;
      const message = document.getElementById('inquiry-message').value;

      const subject = encodeURIComponent(`Artwork Inquiry: ${artId}`);
      const body = encodeURIComponent(`Name: ${name}\nContact: ${contact}\nArtwork Reference: ${artId}\n\nMessage:\n${message}`);
      
      window.location.href = `mailto:${artistContactEmail || 'artist@portfolio.com'}?subject=${subject}&body=${body}`;
      
      closeInquiryModal();
      showToast("Inquiry opened in your email client!");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = 'show';
      setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 3000);
    }
  </script>
</body>
</html>
