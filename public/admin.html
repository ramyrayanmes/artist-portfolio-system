<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Artist Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header>
    <div class="brand-logo">Admin Dashboard</div>
    <nav class="nav-links">
      <a href="index.html">View Public Gallery</a>
    </nav>
  </header>

  <main class="container">
    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 30px; align-items: start;">
      
      <!-- Add New Artwork Form -->
      <div style="background: #fff; padding: 20px; border-radius: 6px; border: 1px solid #e5e5e5;">
        <h3 style="font-family: 'Cinzel', serif; margin-bottom: 15px; font-size: 11pt;">Add New Artwork</h3>
        <form id="add-artwork-form" onsubmit="handleAddNewArtwork(event)" style="display: flex; flex-direction: column; gap: 10px;">
          <div>
            <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Artwork ID</label>
            <input type="text" id="new-id" class="form-control" placeholder="e.g. ART-1002" required style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div>
            <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Title</label>
            <input type="text" id="new-title" class="form-control" required style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div>
            <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Collection / Phase</label>
            <input type="text" id="new-phase" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Medium</label>
              <input type="text" id="new-medium" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
            <div>
              <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Year</label>
              <input type="number" id="new-year" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Height (cm)</label>
              <input type="number" step="0.1" id="new-hcm" class="form-control" oninput="calcInches()" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
            <div>
              <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Width (cm)</label>
              <input type="number" step="0.1" id="new-wcm" class="form-control" oninput="calcInches()" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Status</label>
              <select id="new-status" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
                <option value="Available">Available</option>
                <option value="Sold">Sold</option>
                <option value="NFS">NFS</option>
                <option value="POA">POA</option>
              </select>
            </div>
            <div>
              <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Price ($)</label>
              <input type="number" id="new-price" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
          </div>
          <div>
            <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Artwork Image File</label>
            <input type="file" id="new-image-file" accept="image/*" style="font-size: 8.5pt;" required>
          </div>
          <button type="submit" style="background: var(--primary-color); color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 5px;">Save & Upload Artwork</button>
        </form>
      </div>

      <!-- Inventory Table / List -->
      <div style="background: #fff; padding: 20px; border-radius: 6px; border: 1px solid #e5e5e5;">
        <h3 style="font-family: 'Cinzel', serif; margin-bottom: 15px; font-size: 11pt;">Existing Inventory</h3>
        <div id="admin-inventory-list" style="display: flex; flex-direction: column; gap: 10px; max-height: 600px; overflow-y: auto;">
          <!-- Populated dynamically -->
        </div>
      </div>

    </div>
  </main>

  <script>
    const SUPABASE_URL = 'YOUR_SUPABASE_PROJECT_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabaseClient
