<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Artist Portfolio Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- jsPDF for Client-side PDF Exporting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    #auth-screen { display: flex; justify-content: center; align-items: center; min-height: 70vh; }
    #admin-app { display: none; }
    
    .admin-nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 2px solid #e5e5e5;
      padding-bottom: 10px;
    }
    .tab-btn {
      background: none;
      border: none;
      font-family: 'Cinzel', serif;
      font-size: 10pt;
      font-weight: 700;
      padding: 8px 16px;
      cursor: pointer;
      color: #666;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    .tab-btn.active {
      background: var(--primary-color, #1a1a1a);
      color: #ffffff;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .admin-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 25px;
      align-items: start;
    }

    .form-card {
      background: #ffffff;
      padding: 20px;
      border-radius: 6px;
      border: 1px solid #e5e5e5;
      position: sticky;
      top: 20px;
    }

    .inventory-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 6px;
      border: 1px solid #e5e5e5;
    }

    .filter-bar-admin {
      background: #fafafa;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid #eee;
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .export-bar {
      background: #f4f6f8;
      padding: 12px;
      border-radius: 4px;
      border: 1px solid #e1e4e8;
      margin-bottom: 15px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 15px;
    }

    .artwork-card {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .phase-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--accent-color, #c5a059);
      color: #ffffff;
      font-size: 7.5pt;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 3px;
    }

    .artwork-thumb {
      width: 100%;
      height: 160px;
      object-fit: contain;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }

    .artwork-info { padding: 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .artwork-card-title { font-family: 'Cinzel', serif; font-weight: bold; font-size: 10pt; }
    .artwork-card-meta { font-size: 8pt; color: #666; }
    .artwork-card-price { font-size: 9pt; font-weight: bold; color: var(--accent-color, #c5a059); margin-top: 4px; }
    
    .card-actions {
      margin-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn-action {
      border: none;
      padding: 5px 8px;
      border-radius: 3px;
      font-size: 7.5pt;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-edit { background: var(--primary-color, #1a1a1a); color: #fff; }
    .btn-pdf { background: var(--accent-color, #c5a059); color: #fff; }
    .btn-delete { background: #d9534f; color: #fff; }

    /* Modal Overlay */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.6);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .modal-card {
      background: #ffffff;
      border-radius: 6px;
      width: 100%;
      max-width: 550px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    .modal-header { font-family: 'Cinzel', serif; font-size: 12pt; font-weight: bold; border-bottom: 1px solid #ddd; padding-bottom: 8px; margin-bottom: 15px; }
    .modal-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .full-width { grid-column: 1/-1; }

    /* Toast Notification */
    #toast {
      visibility: hidden;
      min-width: 250px;
      background-color: #333;
      color: #fff;
      text-align: center;
      border-radius: 4px;
      padding: 12px;
      position: fixed;
      z-index: 3000;
      right: 20px;
      bottom: 20px;
      font-size: 9pt;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    #toast.show { visibility: visible; animation: fadein 0.3s, fadeout 0.5s 2.5s; }
    @keyframes fadein { from { bottom: 0; opacity: 0; } to { bottom: 20px; opacity: 1; } }
    @keyframes fadeout { from { bottom: 20px; opacity: 1; } to { bottom: 0; opacity: 0; } }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid var(--accent-color, #c5a059);
      border-radius: 50%;
      width: 14px;
      height: 14px;
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    @media (max-width: 900px) {
      .admin-layout { grid-template-columns: 1fr; }
      .form-card { position: static; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo">Admin Dashboard</div>
    <nav class="nav-links">
      <a href="index.html" style="color:#fff; text-decoration:none; font-size:9pt; font-weight:500;">View Public Gallery</a>
      <a href="#" id="logout-btn" onclick="handleLogout()" style="display:none; color:#fff; text-decoration:none; font-size:9pt; font-weight:500;">Logout</a>
    </nav>
  </header>

  <!-- Secure Login Screen -->
  <div id="auth-screen" class="container">
    <div style="background: #fff; padding: 30px; border-radius: 6px; border: 1px solid #e5e5e5; width: 100%; max-width: 400px;">
      <h3 style="font-family: 'Cinzel', serif; margin-bottom: 15px; font-size: 12pt; text-align: center;">Admin Authentication</h3>
      <form onsubmit="handleLogin(event)" style="display: flex; flex-direction: column; gap: 12px;">
        <div>
          <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Email Address</label>
          <input type="email" id="login-email" class="form-control" required style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <div>
          <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Password</label>
          <input type="password" id="login-password" class="form-control" required style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
        </div>
        <button type="submit" id="login-btn" style="background: var(--primary-color, #1a1a1a); color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 5px;">Login to Dashboard</button>
      </form>
    </div>
  </div>

  <!-- Main Admin Interface -->
  <main class="container" id="admin-app" style="max-width: 1300px; margin: 30px auto; padding: 0 20px;">
    
    <!-- Navigation Tabs -->
    <div class="admin-nav-tabs">
      <button class="tab-btn active" onclick="switchTab('inventory-tab', this)">Art Catalog & Inventory</button>
      <button class="tab-btn" onclick="switchTab('branding-tab', this)">Artist Branding & Theme</button>
    </div>

    <!-- TAB 1: Inventory & Artwork Management -->
    <div id="inventory-tab" class="tab-content active">
      <div class="admin-layout">
        
        <!-- Add New Artwork Form -->
        <div class="form-card">
          <h3 style="font-family: 'Cinzel', serif; margin-bottom: 15px; font-size: 11pt;">Add New Artwork</h3>
          <form id="add-artwork-form" onsubmit="handleAddNewArtwork(event)" style="display: flex; flex-direction: column; gap: 10px;">
            <div>
              <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Artwork ID</label>
              <input type="text" id="new-id" class="form-control" placeholder="e.g. ART-1002" required style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
            <div>
              <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Title</label>
              <input type="text" id="new-title" class="form-control" required style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
            <div>
              <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Collection / Phase</label>
              <input type="text" id="new-phase" class="form-control" placeholder="e.g. Phase I" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <div>
                <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Medium</label>
                <input type="text" id="new-medium" class="form-control" placeholder="Oil on Canvas" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
              </div>
              <div>
                <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Year</label>
                <input type="number" id="new-year" class="form-control" placeholder="2026" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
              </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <div>
                <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Height (cm)</label>
                <input type="number" step="0.1" id="new-hcm" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
              </div>
              <div>
                <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Width (cm)</label>
                <input type="number" step="0.1" id="new-wcm" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
              </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
              <div>
                <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Status</label>
                <select id="new-status" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
                  <option value="Available">Available</option>
                  <option value="Sold">Sold</option>
                  <option value="NFS">NFS</option>
                  <option value="POA">POA</option>
                </select>
              </div>
              <div>
                <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Price (EGP)</label>
                <input type="number" id="new-price" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
              </div>
            </div>
            <div>
              <label style="font-size: 8pt; font-weight: 600; display: block; margin-bottom: 3px;">Artwork Image File (Auto-compressed)</label>
              <input type="file" id="new-image-file" accept="image/*" style="font-size: 8.5pt;" required>
            </div>
            <button type="submit" id="submit-art-btn" style="background: var(--primary-color, #1a1a1a); color: #fff; border: none; padding: 10px; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 5px;">Save & Compress Artwork</button>
          </form>
        </div>

        <!-- Inventory Grid & Reports -->
        <div class="inventory-container">
          
          <!-- PDF Export Bar -->
          <div class="export-bar">
            <span style="font-size: 8.5pt; font-weight: 600; color: #444;">Export Reports:</span>
            <button onclick="exportCollectionPDF('catalog')" class="btn-action btn-pdf">Download Detailed Catalog PDF</button>
            <button onclick="exportCollectionPDF('grid')" class="btn-action btn-pdf">Download Grid Catalog PDF</button>
          </div>

          <!-- Admin Filter Bar -->
          <div class="filter-bar-admin">
            <input type="text" id="admin-search-text" placeholder="Search Title or ID..." onkeyup="filterAdminInventory()" style="flex:1; min-width:140px; padding:6px 10px; font-size:8.5pt; border:1px solid #ccc; border-radius:4px;">
            <select id="admin-filter-phase" onchange="filterAdminInventory()" style="flex:1; min-width:120px; padding:6px 10px; font-size:8.5pt; border:1px solid #ccc; border-radius:4px;">
              <option value="ALL">All Collections</option>
            </select>
            <select id="admin-filter-medium" onchange="filterAdminInventory()" style="flex:1; min-width:120px; padding:6px 10px; font-size:8.5pt; border:1px solid #ccc; border-radius:4px;">
              <option value="ALL">All Mediums</option>
            </select>
            <select id="admin-filter-status" onchange="filterAdminInventory()" style="flex:1; min-width:110px; padding:6px 10px; font-size:8.5pt; border:1px solid #ccc; border-radius:4px;">
              <option value="ALL">All Statuses</option>
            </select>
          </div>

          <div id="admin-artwork-count" style="font-size: 8.5pt; color: #666; margin-bottom: 10px;">Loading inventory...</div>
          <div id="admin-inventory-grid" class="admin-grid"></div>
        </div>

      </div>
    </div>

    <!-- TAB 2: Artist Branding Configuration -->
    <div id="branding-tab" class="tab-content">
      <div style="background: #ffffff; padding: 25px; border-radius: 6px; border: 1px solid #e5e5e5; max-width: 700px;">
        <h3 style="font-family: 'Cinzel', serif; margin-bottom: 15px; font-size: 12pt;">Manage Branding & Theme Settings</h3>
        <form onsubmit="handleSaveBranding(event)" style="display: flex; flex-direction: column; gap: 15px;">
          <div>
            <label style="font-size: 8.5pt; font-weight: 600; display: block; margin-bottom: 4px;">Artist Name</label>
            <input type="text" id="brand-artist-name" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;" required>
          </div>
          <div>
            <label style="font-size: 8.5pt; font-weight: 600; display: block; margin-bottom: 4px;">Artist Statement (Short summary for gallery header)</label>
            <textarea id="brand-artist-statement" rows="3" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; font-family:inherit; font-size:9pt;"></textarea>
          </div>
          <div>
            <label style="font-size: 8.5pt; font-weight: 600; display: block; margin-bottom: 4px;">Artist Biography (Full bio)</label>
            <textarea id="brand-artist-bio" rows="4" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px; font-family:inherit; font-size:9pt;"></textarea>
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
              <label style="font-size: 8.5pt; font-weight: 600; display: block; margin-bottom: 4px;">Contact Email</label>
              <input type="email" id="brand-contact-email" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
            <div>
              <label style="font-size: 8.5pt; font-weight: 600; display: block; margin-bottom: 4px;">Contact Phone / WhatsApp</label>
              <input type="text" id="brand-contact-phone" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
            </div>
          </div>
          <div>
            <label style="font-size: 8.5pt; font-weight: 600; display: block; margin-bottom: 4px;">Theme Accent Color (HEX)</label>
            <input type="color" id="brand-accent-color" style="height:40px; width:100px; padding:2px; border:1px solid #ccc; border-radius:4px; cursor:pointer;">
          </div>
          <button type="submit" id="save-branding-btn" style="background: var(--accent-color, #c5a059); color: #fff; border: none; padding: 12px; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 10px;">Save Branding Settings</button>
        </form>
      </div>
    </div>

  </main>

  <!-- Edit Artwork Modal Overlay -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal-card">
      <div class="modal-header">Edit Artwork Details</div>
      <form id="edit-artwork-form" onsubmit="submitArtworkEdit(event)">
        <input type="hidden" id="edit-art-id">
        <div class="modal-grid">
          <div class="form-group full-width">
            <label style="font-size:8pt; font-weight:600; display:block; margin-bottom:3px;">Title</label>
            <input type="text" id="edit-art-title" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;" required>
          </div>
          <div class="form-group">
            <label style="font-size:8pt; font-weight:600; display:block; margin-bottom:3px;">Collection / Phase</label>
            <input type="text" id="edit-art-phase" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;" required>
          </div>
          <div class="form-group">
            <label style="font-size:8pt; font-weight:600; display:block; margin-bottom:3px;">Year</label>
            <input type="number" id="edit-art-year" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div class="form-group full-width">
            <label style="font-size:8pt; font-weight:600; display:block; margin-bottom:3px;">Medium</label>
            <input type="text" id="edit-art-medium" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div class="form-group">
            <label style="font-size:8pt; font-weight:600; display:block; margin-bottom:3px;">Height (CM)</label>
            <input type="number" step="0.1" id="edit-art-hcm" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;" required>
          </div>
          <div class="form-group">
            <label style="font-size:8pt; font-weight:600; display:block; margin-bottom:3px;">Width (CM)</label>
            <input type="number" step="0.1" id="edit-art-wcm" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;" required>
          </div>
          <div class="form-group">
            <label style="font-size:8pt; font-weight:600; display:block; margin-bottom:3px;">Status</label>
            <select id="edit-art-status" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
              <option value="Available">Available</option>
              <option value="Sold">Sold</option>
              <option value="NFS">NFS</option>
              <option value="POA">POA</option>
            </select>
          </div>
          <div class="form-group">
            <label style="font-size:8pt; font-weight:600; display:block; margin-bottom:3px;">Price (EGP)</label>
            <input type="number" id="edit-art-price" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
          </div>
          <div class="form-group full-width">
            <label style="font-size:8pt; font-weight:600; display:block; margin-bottom:3px;">Image URL (Optional update)</label>
            <input type="text" id="edit-art-url" class="form-control" style="width:100%; padding:8px; border:1px solid #ccc; border-radius:4px;">
          </div>
        </div>
        <div style="display:flex; gap:10px; margin-top:15px;">
          <button type="submit" id="edit-submit-btn" style="background: var(--accent-color, #c5a059); color: #fff; border: none; padding: 10px 15px; border-radius: 4px; font-weight: 600; cursor: pointer;">Save Changes</button>
          <button type="button" onclick="closeEditModal()" style="background: #e0e0e0; color: #333; border: none; padding: 10px 15px; border-radius: 4px; font-weight: 600; cursor: pointer;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    // ⚠️ REPLACE WITH YOUR ACTUAL SUPABASE CREDENTIALS
    const SUPABASE_URL = 'https://your-project-id.supabase.co';
    const SUPABASE_ANON_KEY = 'your-anon-key-here';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allAdminArtworksCache = [];
    let currentFilteredArtworks = [];
    let activeBrandingConfig = {};

    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        showAdminApp();
      }
    });

    function switchTab(tabId, btnElem) {
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(tb => tb.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btnElem.classList.add('active');
    }

    async function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const loginBtn = document.getElementById('login-btn');

      loginBtn.innerHTML = '<span class="spinner"></span> Authenticating...';
      
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      
      if (error) {
        showToast("Login failed: " + error.message);
        loginBtn.innerHTML = 'Login to Dashboard';
      } else {
        showToast("Login successful!");
        showAdminApp();
      }
    }

    async function handleLogout() {
      await supabaseClient.auth.signOut();
      document.getElementById('auth-screen').style.display = 'flex';
      document.getElementById('admin-app').style.display = 'none';
      document.getElementById('logout-btn').style.display = 'none';
      showToast("Logged out successfully.");
    }

    function showAdminApp() {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('admin-app').style.display = 'block';
      document.getElementById('logout-btn').style.display = 'inline';
      loadAdminInventory();
      loadBrandingSettings();
    }

    async function loadAdminInventory() {
      const { data: artworks, error } = await supabaseClient.from('artworks').select('*').order('artwork_id', { ascending: true });
      
      if (error) {
        showToast("Error loading inventory: " + error.message);
        return;
      }

      allAdminArtworksCache = artworks || [];
      populateAdminFilters(allAdminArtworksCache);
      filterAdminInventory();
    }

    function populateAdminFilters(artworks) {
      const phases = new Set();
      const mediums = new Set();
      const statuses = new Set();

      artworks.forEach(art => {
        if (art.phase_collection) phases.add(String(art.phase_collection).trim());
        if (art.medium) mediums.add(String(art.medium).trim());
        if (art.status) statuses.add(String(art.status).trim());
      });

      fillAdminSelect('admin-filter-phase', Array.from(phases).sort(), 'All Collections');
      fillAdminSelect('admin-filter-medium', Array.from(mediums).sort(), 'All Mediums');
      fillAdminSelect('admin-filter-status', Array.from(statuses).sort(), 'All Statuses');
    }

    function fillAdminSelect(elemId, list, defaultLabel) {
      const sel = document.getElementById(elemId);
      sel.innerHTML = `<option value="ALL">${defaultLabel}</option>`;
      list.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.innerText = item;
        sel.appendChild(opt);
      });
    }

    function filterAdminInventory() {
      const searchText = document.getElementById('admin-search-text').value.toLowerCase().trim();
      const fPhase = document.getElementById('admin-filter-phase').value;
      const fMedium = document.getElementById('admin-filter-medium').value;
      const fStatus = document.getElementById('admin-filter-status').value;

      currentFilteredArtworks = allAdminArtworksCache.filter(art => {
        const matchesSearch = !searchText || 
          String(art.title || '').toLowerCase().includes(searchText) || 
          String(art.artwork_id || '').toLowerCase().includes(searchText);
        
        const matchesPhase = fPhase === 'ALL' || String(art.phase_collection || '').trim() === fPhase;
        const matchesMedium = fMedium === 'ALL' || String(art.medium || '').trim() === fMedium;
        const matchesStatus = fStatus === 'ALL' || String(art.status || '').trim() === fStatus;

        return matchesSearch && matchesPhase && matchesMedium && matchesStatus;
      });

      renderAdminGrid(currentFilteredArtworks);
    }

    function renderAdminGrid(artworks) {
      const grid = document.getElementById('admin-inventory-grid');
      const countBadge = document.getElementById('admin-artwork-count');
      grid.innerHTML = '';

      if (!artworks || artworks.length === 0) {
        countBadge.innerText = "0 artworks matched.";
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 30px; color: #666;">No artworks found matching criteria.</div>';
        return;
      }

      countBadge.innerText = `Showing ${artworks.length} of ${allAdminArtworksCache.length} artwork(s)`;

      artworks.forEach(art => {
        const card = document.createElement('div');
        card.className = 'artwork-card';

        const displayPrice = art.price ? `${parseFloat(art.price).toLocaleString('en-US', { minimumFractionDigits: 2 })} EGP` : (art.status || 'POA');
        const imgUrl = art.image_url || 'https://via.placeholder.com/300x200?text=No+Image';

        card.innerHTML = `
          <div class="phase-tag">${art.phase_collection || 'Unassigned'}</div>
          <img src="${imgUrl}" class="artwork-thumb" alt="${art.title}" />
          <div class="artwork-info">
            <div class="artwork-card-title">${art.artwork_id}: ${art.title || 'Untitled'}</div>
            <div class="artwork-card-meta">${art.medium || 'Unspecified'}</div>
            <div class="artwork-card-meta">${art.height_cm || 0} × ${art.width_cm || 0} cm</div>
            <div class="artwork-card-price">${displayPrice}</div>
            <div class="card-actions">
              <button onclick='openEditModal(${JSON.stringify(art)})' class="btn-action btn-edit">Edit</button>
              <button onclick='generateCOAPDF(${JSON.stringify(art)})' class="btn-action btn-pdf">COA PDF</button>
              <button onclick="deleteArtwork('${art.artwork_id}')" class="btn-action btn-delete">Delete</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    /* CLIENT-SIDE IMAGE COMPRESSION HELPER */
    async function compressImageFile(file, maxWidth = 1600, quality = 0.85) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            canvas.toBlob((blob) => {
              const compressedFile = new File([blob], file.name.replace(/\.[^/.]+$/, "") + ".webp", {
                type: 'image/webp',
                lastModified: Date.now()
              });
              resolve(compressedFile);
            }, 'image/webp', quality);
          };
        };
      });
    }

    async function handleAddNewArtwork(e) {
      e.preventDefault();
      const fileInput = document.getElementById('new-image-file');
      if (!fileInput.files[0]) return;
      const submitBtn = document.getElementById('submit-art-btn');
      
      submitBtn.innerHTML = '<span class="spinner"></span> Compressing image...';
      submitBtn.disabled = true;

      // Compress image client-side before upload
      const compressedFile = await compressImageFile(fileInput.files[0]);

      submitBtn.innerHTML = '<span class="spinner"></span> Uploading to storage...';

      const filePath = `artwork_${Date.now()}_${compressedFile.name}`;
      const { data: uploadData, error: uploadError } = await supabaseClient.storage
        .from('artworks-bucket')
        .upload(filePath, compressedFile);

      if (uploadError) {
        showToast('Image upload failed: ' + uploadError.message);
        submitBtn.innerHTML = 'Save & Compress Artwork';
        submitBtn.disabled = false;
        return;
      }

      const { data: urlData } = supabaseClient.storage
        .from('artworks-bucket')
        .getPublicUrl(filePath);
      
      const publicImageUrl = urlData.publicUrl;
      const hCm = parseFloat(document.getElementById('new-hcm').value) || 0;
      const wCm = parseFloat(document.getElementById('new-wcm').value) || 0;

      const payload = {
        artwork_id: document.getElementById('new-id').value,
        title: document.getElementById('new-title').value,
        phase_collection: document.getElementById('new-phase').value,
        medium: document.getElementById('new-medium').value,
        year: parseInt(document.getElementById('new-year').value) || null,
        height_cm: hCm,
        width_cm: wCm,
        height_inches: Math.round((hCm / 2.54) * 10) / 10,
        width_inches: Math.round((wCm / 2.54) * 10) / 10,
        status: document.getElementById('new-status').value,
        price: parseFloat(document.getElementById('new-price').value) || 0,
        image_url: publicImageUrl
      };

      const { error } = await supabaseClient.from('artworks').insert([payload]);
      
      submitBtn.innerHTML = 'Save & Compress Artwork';
      submitBtn.disabled = false;

      if (error) {
        showToast('Error saving artwork: ' + error.message);
      } else {
        showToast('Artwork compressed, uploaded, and saved successfully!');
        document.getElementById('add-artwork-form').reset();
        loadAdminInventory();
      }
    }

    function openEditModal(art) {
      document.getElementById('edit-art-id').value = art.artwork_id;
      document.getElementById('edit-art-title').value = art.title || '';
      document.getElementById('edit-art-phase').value = art.phase_collection || '';
      document.getElementById('edit-art-year').value = art.year || '';
      document.getElementById('edit-art-medium').value = art.medium || '';
      document.getElementById('edit-art-hcm').value = art.height_cm || 0;
      document.getElementById('edit-art-wcm').value = art.width_cm || 0;
      document.getElementById('edit-art-status').value = art.status || 'Available';
      document.getElementById('edit-art-price').value = art.price || 0;
      document.getElementById('edit-art-url').value = art.image_url || '';
      
      document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('edit-modal').style.display = 'none';
    }

    async function submitArtworkEdit(e) {
      e.preventDefault();
      const artId = document.getElementById('edit-art-id').value;
      const hCm = parseFloat(document.getElementById('edit-art-hcm').value) || 0;
      const wCm = parseFloat(document.getElementById('edit-art-wcm').value) || 0;

      const payload = {
        title: document.getElementById('edit-art-title').value,
        phase_collection: document.getElementById('edit-art-phase').value,
        year: parseInt(document.getElementById('edit-art-year').value) || null,
        medium: document.getElementById('edit-art-medium').value,
        height_cm: hCm,
        width_cm: wCm,
        height_inches: Math.round((hCm / 2.54) * 10) / 10,
        width_inches: Math.round((wCm / 2.54) * 10) / 10,
        status: document.getElementById('edit-art-status').value,
        price: parseFloat(document.getElementById('edit-art-price').value) || 0,
        image_url: document.getElementById('edit-art-url').value
      };

      showToast("Saving changes...");
      const { error } = await supabaseClient.from('artworks').update(payload).eq('artwork_id', artId);

      if (error) {
        showToast("Error updating: " + error.message);
      } else {
        showToast("Artwork updated successfully!");
        closeEditModal();
        loadAdminInventory();
      }
    }

    async function deleteArtwork(artworkId) {
      if (!confirm(`Are you sure you want to delete ${artworkId}?`)) return;
      
      showToast('Deleting artwork...');
      const { error } = await supabaseClient.from('artworks').delete().eq('artwork_id', artworkId);
      
      if (error) {
        showToast('Error deleting: ' + error.message);
      } else {
        showToast('Artwork deleted.');
        loadAdminInventory();
      }
    }

    /* BRANDING SETTINGS FUNCTIONS */
    async function loadBrandingSettings() {
      const { data, error } = await supabaseClient.from('branding_config').select('*');
      if (data) {
        data.forEach(item => activeBrandingConfig[item.key] = item.value);
        
        document.getElementById('brand-artist-name').value = activeBrandingConfig.Artist_Name || '';
        document.getElementById('brand-artist-statement').value = activeBrandingConfig.Artist_Statement || '';
        document.getElementById('brand-artist-bio').value = activeBrandingConfig.Artist_Bio || '';
        document.getElementById('brand-contact-email').value = activeBrandingConfig.Contact_Email || '';
        document.getElementById('brand-contact-phone').value = activeBrandingConfig.Contact_Phone || '';
        document.getElementById('brand-accent-color').value = activeBrandingConfig.Accent_Color || '#c5a059';
      }
    }

    async function handleSaveBranding(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('save-branding-btn');
      saveBtn.innerHTML = '<span class="spinner"></span> Saving branding...';

      const updates = [
        { key: 'Artist_Name', value: document.getElementById('brand-artist-name').value },
        { key: 'Artist_Statement', value: document.getElementById('brand-artist-statement').value },
        { key: 'Artist_Bio', value: document.getElementById('brand-artist-bio').value },
        { key: 'Contact_Email', value: document.getElementById('brand-contact-email').value },
        { key: 'Contact_Phone', value: document.getElementById('brand-contact-phone').value },
        { key: 'Accent_Color', value: document.getElementById('brand-accent-color').value }
      ];

      const { error } = await supabaseClient.from('branding_config').upsert(updates);
      saveBtn.innerHTML = 'Save Branding Settings';

      if (error) {
        showToast("Error updating branding: " + error.message);
      } else {
        showToast("Branding updated successfully!");
        loadBrandingSettings();
      }
    }

    /* CLIENT-SIDE PDF EXPORT FUNCTIONS USING JSPDF */
    function generateCOAPDF(art) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const artistName = activeBrandingConfig.Artist_Name || 'Artist';

      doc.setFont("Cinzel", "bold");
      doc.setFontSize(22);
      doc.text("CERTIFICATE OF AUTHENTICITY", 105, 30, null, null, "center");

      doc.setFontSize(14);
      doc.setFont("Montserrat", "normal");
      doc.text(`This document certifies that the artwork detailed below is an authentic original work by`, 105, 45, null, null, "center");
      doc.setFont("Cinzel", "bold");
      doc.text(artistName.toUpperCase(), 105, 53, null, null, "center");

      doc.setLineWidth(0.5);
      doc.rect(20, 65, 170, 95);

      doc.setFontSize(11);
      doc.setFont("Montserrat", "bold");
      doc.text("Artwork ID:", 30, 80);
      doc.setFont("Montserrat", "normal");
      doc.text(String(art.artwork_id || ''), 75, 80);

      doc.setFont("Montserrat", "bold");
      doc.text("Title:", 30, 95);
      doc.setFont("Montserrat", "normal");
      doc.text(String(art.title || 'Untitled'), 75, 95);

      doc.setFont("Montserrat", "bold");
      doc.text("Collection / Phase:", 30, 110);
      doc.setFont("Montserrat", "normal");
      doc.text(String(art.phase_collection || 'N/A'), 75, 110);

      doc.setFont("Montserrat", "bold");
      doc.text("Medium:", 30, 125);
      doc.setFont("Montserrat", "normal");
      doc.text(String(art.medium || 'N/A'), 75, 125);

      doc.setFont("Montserrat", "bold");
      doc.text("Dimensions:", 30, 140);
      doc.setFont("Montserrat", "normal");
      doc.text(`${art.height_cm || 0} x ${art.width_cm || 0} cm (${art.height_inches || 0} x ${art.width_inches || 0} in)`, 75, 140);

      doc.line(110, 210, 180, 210);
      doc.setFontSize(10);
      doc.text("Artist Signature", 145, 216, null, null, "center");
      doc.text(`Date: ${new Date().toLocaleDateString()}`, 30, 216);

      doc.save(`COA_${art.artwork_id}.pdf`);
      showToast("COA PDF generated!");
    }

    function exportCollectionPDF(type) {
      if (!currentFilteredArtworks || currentFilteredArtworks.length === 0) {
        showToast("No artworks available in current view to export.");
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const artistName = activeBrandingConfig.Artist_Name || 'Artist Catalog';

      doc.setFont("Cinzel", "bold");
      doc.setFontSize(18);
      doc.text(`${artistName.toUpperCase()} - ARTWORK CATALOG`, 14, 20);

      doc.setFontSize(10);
      doc.setFont("Montserrat", "normal");
      doc.text(`Generated on: ${new Date().toLocaleDateString()} | Total Items: ${currentFilteredArtworks.length}`, 14, 27);
      doc.line(14, 30, 196, 30);

      let yPos = 40;

      if (type === 'catalog') {
        currentFilteredArtworks.forEach((art, idx) => {
          if (yPos > 260) {
            doc.addPage();
            yPos = 20;
          }

          doc.setFont("Cinzel", "bold");
          doc.setFontSize(11);
          doc.text(`${idx + 1}. ${art.title || 'Untitled'} (${art.artwork_id})`, 14, yPos);
          
          doc.setFont("Montserrat", "normal");
          doc.setFontSize(9.5);
          const priceStr = art.price ? `${parseFloat(art.price).toLocaleString()} EGP` : art.status;
          doc.text(`Collection: ${art.phase_collection || 'N/A'} | Medium: ${art.medium || 'N/A'} | Status: ${art.status} | Price: ${priceStr}`, 14, yPos + 6);
          doc.text(`Dimensions: ${art.height_cm || 0} x ${art.width_cm || 0} cm`, 14, yPos + 12);
          
          doc.setDrawColor(230);
          doc.line(14, yPos + 16, 196, yPos + 16);
          yPos += 22;
        });
      } else {
        currentFilteredArtworks.forEach((art, idx) => {
          if (yPos > 260) {
            doc.addPage();
            yPos = 20;
          }
          const priceStr = art.price ? `${parseFloat(art.price).toLocaleString()} EGP` : art.status;
          doc.setFontSize(9.5);
          doc.text(`${art.artwork_id} - ${art.title} [${art.phase_collection || 'N/A'}] — ${priceStr}`, 14, yPos);
          yPos += 8;
        });
      }

      doc.save(`Artwork_Catalog_${Date.now()}.pdf`);
      showToast("Catalog PDF generated!");
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = 'show';
      setTimeout(() => { toast.className = toast.className.replace('show', ''); }, 3000);
    }
  </script>
